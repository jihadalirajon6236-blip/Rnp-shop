<!doctype html><html lang="bn"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RNP SHOP — Order Now</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#f4f8f6;color:#17211c}.top{background:#087443;color:#fff;padding:16px;text-align:center;font-weight:900;font-size:23px}.wrap{max-width:650px;margin:24px auto;padding:0 15px}.box{background:#fff;border:1px solid #e0eae4;border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.05)}.hint{background:#eaf8f1;padding:12px;border-radius:10px;margin-bottom:18px}.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #edf1ef}.item button{border:0;background:#087443;color:#fff;border-radius:7px;padding:4px 10px}.total{font-size:22px;font-weight:900;margin:18px 0;color:#087443}input,textarea,select{width:100%;padding:13px;margin:6px 0 12px;border:1px solid #d4e2da;border-radius:10px;font:inherit}.btn{width:100%;border:0;background:#087443;color:#fff;padding:14px;border-radius:10px;font-weight:900;font-size:16px}.success{display:none;background:#eaf8f1;padding:16px;border-radius:12px;margin-top:15px}.success a{display:block;text-align:center;margin-top:9px;text-decoration:none}.back{display:block;text-align:center;margin-top:16px;color:#087443;text-decoration:none;font-weight:800}</style></head><body><div class="top">RNP SHOP — সরাসরি অর্ডার</div><main class="wrap"><div class="box"><div class="hint">🛍️ পণ্য বেছে নিন, তথ্য দিন এবং <b>অর্ডার কনফার্ম করুন</b>।</div><div id="products"></div><div class="total">মোট: ৳<span id="total">0</span></div><form id="form"><input id="name" required placeholder="আপনার নাম"><input id="phone" required placeholder="মোবাইল নম্বর"><textarea id="address" required placeholder="সম্পূর্ণ ডেলিভারি ঠিকানা"></textarea><select id="payment"><option>Cash on Delivery</option><option>bKash</option><option>Nagad</option></select><textarea id="note" placeholder="অতিরিক্ত নোট (ঐচ্ছিক)"></textarea><button class="btn">✅ অর্ডার কনফার্ম করুন</button></form><div class="success" id="success"></div><a class="back" href="/">← RNP SHOP-এ ফিরে যান</a></div></main><script>let products=[],cart=[];const $=id=>document.getElementById(id);function money(n){return Number(n).toLocaleString("bn-BD")}async function loadProducts(){let r=await fetch('/api/products');products=await r.json();render()}function render(){$("products").innerHTML=products.map(p=>{let c=cart.find(x=>x.id===p.id),q=c?c.qty:0;return `<div class="item"><span>${p.image?`<img src="${p.image}" style="width:55px;height:55px;object-fit:cover;border-radius:8px">`:p.icon||'🛍️'} <b>${p.name}</b><br>৳${money(p.price)}</span><span><button type="button" onclick="chg(${p.id},-1)">−</button> ${q} <button type="button" onclick="chg(${p.id},1)">+</button></span></div>`}).join('');$('total').textContent=money(cart.reduce((s,i)=>s+products.find(p=>p.id===i.id).price*i.qty,0))}function chg(id,d){let x=cart.find(i=>i.id===id);if(!x&&d>0)cart.push({id,qty:1});else if(x){x.qty+=d;if(x.qty<1)cart=cart.filter(i=>i.id!==id)}render()}$('form').onsubmit=async e=>{e.preventDefault();if(!cart.length)return alert('অন্তত একটি পণ্য বেছে নিন');let body={customer_name:$('name').value,phone:$('phone').value,address:$('address').value,payment_method:$('payment').value,note:$('note').value,total:cart.reduce((s,i)=>s+products.find(p=>p.id===i.id).price*i.qty,0),items:cart.map(i=>{let p=products.find(x=>x.id===i.id);return{name:p.name,qty:i.qty,price:p.price}})};let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)return alert(d.error||'অর্ডার হয়নি');$('success').style.display='block';$('success').innerHTML=`<b>✅ অর্ডার সফল: ${d.order_no}</b><br>আপনার অর্ডারটি সংরক্ষণ হয়েছে।<a class="btn" href="${d.whatsapp}" target="_blank">WhatsApp-এ অর্ডার পাঠান</a><a class="btn" href="${d.phone}">📞 ফোন করুন</a>`;cart=[];render();e.target.reset()};loadProducts();</script></body></html>
