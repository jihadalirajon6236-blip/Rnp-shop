<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RNP SHOP Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#f3f7f5;color:#17211c}.box{max-width:1150px;margin:25px auto;padding:0 15px}.login,.dash,.panel{background:#fff;border:1px solid #dfe9e3;border-radius:16px;padding:20px}.login{max-width:420px;margin:80px auto}.input{width:100%;padding:12px;border:1px solid #d4e1da;border-radius:9px;margin:7px 0 12px}.btn{border:0;background:#087443;color:#fff;padding:10px 14px;border-radius:9px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.btn.red{background:#b42318}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.stat{background:#eaf8f1;padding:15px;border-radius:12px}.order,.product{border:1px solid #e1e8e4;border-radius:12px;padding:14px;margin:10px 0;background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.status{padding:7px;border:1px solid #d4e1da;border-radius:8px}.small{font-size:13px;color:#68766f}.items{background:#f7faf8;padding:8px;border-radius:8px;margin:8px 0}.product{display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center}.thumb{width:90px;height:90px;object-fit:cover;border-radius:10px;background:#edf8f2;display:grid;place-items:center;font-size:35px}.tabs{display:flex;gap:8px;margin:18px 0}.tab{border:1px solid #d4e1da;background:#fff;padding:10px 14px;border-radius:9px;cursor:pointer;font-weight:800}.tab.active{background:#087443;color:#fff}.hidden{display:none}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid textarea{min-height:80px}.full{grid-column:1/-1}input,textarea{font:inherit}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.product{grid-template-columns:65px 1fr}.product .actions{grid-column:1/-1}.thumb{width:65px;height:65px}.formgrid{grid-template-columns:1fr}}</style></head><body><main class="box">
<div id="login" class="login"><h2>🔐 RNP SHOP Admin</h2><p>Admin Password দিন</p><input id="key" class="input" type="password" placeholder="Rajon123@@"><button class="btn" onclick="login()">Login</button><p class="small">Production-এ অবশ্যই একটি শক্তিশালী ADMIN_KEY ব্যবহার করুন।</p></div>
<div id="dash" class="dash" style="display:none"><div class="top"><h1>RNP SHOP Admin</h1><a class="btn" href="/order" target="_blank">Customer Order Page</a></div><div class="tabs"><button class="tab active" onclick="showTab('orders',this)">📦 Orders</button><button class="tab" onclick="showTab('products',this)">🛍️ Products</button></div>
<section id="orders"><div class="stats"><div class="stat">মোট<br><b id="all">0</b></div><div class="stat">নতুন<br><b id="new">0</b></div><div class="stat">চলমান<br><b id="processing">0</b></div><div class="stat">Delivered<br><b id="delivered">0</b></div></div><div id="ordersList"></div></section>
<section id="products" class="hidden"><div class="panel"><h2>➕ নতুন Product যোগ করুন</h2><div class="formgrid"><input id="pname" class="input" placeholder="Product নাম"><input id="pprice" class="input" type="number" placeholder="দাম (৳)"><input id="picon" class="input" placeholder="Emoji (যেমন 👕)"><input id="pimage" class="input" type="file" accept="image/*"><textarea id="pdesc" class="input full" placeholder="Product description"></textarea></div><button class="btn" onclick="addProduct()">Product যোগ করুন</button><p class="small">ছবি browser থেকেই database-এ সংরক্ষণ হবে। খুব বড় ছবি না দিয়ে ছোট JPG/PNG ব্যবহার করুন।</p></div><div id="productsList"></div></section>
</div></main><script>
let key='';const $=id=>document.getElementById(id);function login(){key=$('key').value.trim();if(!key)return;loadOrders();loadProducts()}async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-key':key};let r=await fetch(url,opt);if(r.status===401){alert('ভুল Admin Password');throw Error('unauthorized')}return r.json()}
function showTab(name,btn){document.querySelectorAll('#orders,#products').forEach(x=>x.classList.add('hidden'));$(name).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
async function loadOrders(){try{let a=await api('/api/orders');$('login').style.display='none';$('dash').style.display='block';$('all').textContent=a.length;$('new').textContent=a.filter(x=>x.status==='new').length;$('processing').textContent=a.filter(x=>['processing','shipped'].includes(x.status)).length;$('delivered').textContent=a.filter(x=>x.status==='delivered').length;$('ordersList').innerHTML=a.map(o=>`<div class="order"><div class="top"><b>${o.order_no}</b><span>${new Date(o.created_at).toLocaleString()}</span></div><p><b>${o.customer_name}</b> · <a href="tel:${o.phone}">${o.phone}</a><br>${o.address}</p><div class="items">${o.items.map(i=>`${i.name} × ${i.qty} = ৳${i.price*i.qty}`).join('<br>')}</div><b>মোট: ৳${o.total}</b> · Payment: ${o.payment_method} / ${o.payment_status}<div class="row" style="margin-top:10px"><label>Status <select class="status" onchange="updateOrder(${o.id},'status',this.value)"><option ${o.status==='new'?'selected':''}>new</option><option ${o.status==='processing'?'selected':''}>processing</option><option ${o.status==='shipped'?'selected':''}>shipped</option><option ${o.status==='delivered'?'selected':''}>delivered</option><option ${o.status==='cancelled'?'selected':''}>cancelled</option></select></label><label>Payment <select class="status" onchange="updateOrder(${o.id},'payment_status',this.value)"><option ${o.payment_status==='unpaid'?'selected':''}>unpaid</option><option ${o.payment_status==='paid'?'selected':''}>paid</option></select></label><a class="btn" href="https://wa.me/?text=${encodeURIComponent('RNP SHOP order '+o.order_no+' - '+o.customer_name+' - ৳'+o.total)}" target="_blank">WhatsApp</a></div></div>`).join('')||'<p>কোনো অর্ডার নেই।</p>'}catch(e){}}
async function updateOrder(id,k,v){await api('/api/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({[k]:v})});loadOrders()}
function fileData(input){return new Promise((resolve,reject)=>{if(!input.files[0])return resolve('');let f=input.files[0];if(f.size>2*1024*1024)return reject(Error('ছবির size 2MB-এর কম রাখুন'));let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}
async function addProduct(){try{let image=await fileData($('pimage'));let body={name:$('pname').value.trim(),price:Number($('pprice').value),icon:$('picon').value.trim()||'🛍️',description:$('pdesc').value.trim(),image};if(!body.name||!body.price)return alert('নাম ও দাম দিন');await api('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('pname').value='';$('pprice').value='';$('picon').value='';$('pdesc').value='';$('pimage').value='';loadProducts()}catch(e){alert(e.message)}}
async function loadProducts(){try{let a=await fetch('/api/products').then(r=>r.json());$('productsList').innerHTML=a.map(p=>`<div class="product"><div class="thumb">${p.image?`<img src="${p.image}" style="width:100%;height:100%;object-fit:cover;border-radius:10px">`:p.icon||'🛍️'}</div><div><input id="n${p.id}" class="input" value="${esc(p.name)}"><input id="pr${p.id}" class="input" type="number" value="${p.price}"><input id="i${p.id}" class="input" value="${esc(p.icon||'🛍️')}"><input id="f${p.id}" class="input" type="file" accept="image/*"><textarea id="d${p.id}" class="input">${esc(p.description||'')}</textarea></div><div class="actions row"><button class="btn" onclick="saveProduct(${p.id})">💾 Save</button><button class="btn red" onclick="deleteProduct(${p.id})">🗑️ Delete</button></div></div>`).join('')||'<p>কোনো Product নেই।</p>'}catch(e){}}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
async function saveProduct(id){try{let image=await fileData($('f'+id));let body={name:$('n'+id).value.trim(),price:Number($('pr'+id).value),icon:$('i'+id).value.trim()||'🛍️',description:$('d'+id).value.trim()};if(image)body.image=image;await api('/api/products/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});alert('Product আপডেট হয়েছে');loadProducts()}catch(e){alert(e.message)}}
async function deleteProduct(id){if(!confirm('এই Product মুছে ফেলবেন?'))return;await api('/api/products/'+id,{method:'DELETE'});loadProducts()}
</script></body></html>
