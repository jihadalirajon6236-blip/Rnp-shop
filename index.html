<!doctype html><html lang="bn"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RNP SHOP</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#f4f8f6;color:#17211c}
header{background:#fff;border-bottom:1px solid #e2ebe6;position:sticky;top:0;z-index:5}.nav{max-width:1100px;margin:auto;padding:13px 16px;display:flex;gap:12px;align-items:center}.logo{font-size:25px;font-weight:900;color:#087443}.search{flex:1}.search input{width:100%;padding:11px;border:1px solid #dbe7e0;border-radius:10px}.btn{border:0;background:#087443;color:white;padding:11px 15px;border-radius:10px;font-weight:800;cursor:pointer}
.hero{max-width:1100px;margin:18px auto;padding:36px 22px;border-radius:22px;background:linear-gradient(135deg,#064e35,#0b8f55);color:white}.hero h1{font-size:48px;margin:0}.hero p{line-height:1.7}.wrap{max-width:1100px;margin:auto;padding:0 16px 40px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}.card{background:white;border:1px solid #e1ebe5;border-radius:15px;padding:16px}.pic{height:150px;display:grid;place-items:center;background:#edf8f2;border-radius:12px;font-size:65px}.price{font-size:20px;font-weight:900;color:#087443;margin:7px 0}.order{margin-top:30px;background:white;padding:20px;border-radius:16px;border:1px solid #e1ebe5}.order input,.order textarea,.order select{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #d5e3db;border-radius:9px}.items{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:8px 0}.qty button{width:28px}.success{display:none;background:#eaf8f1;padding:18px;border-radius:12px;margin-top:15px}.success a{display:inline-block;margin:6px 5px 0 0;text-decoration:none}.muted{color:#66756d}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.nav{flex-wrap:wrap}.search{flex-basis:100%;order:3}.hero h1{font-size:37px}}
</style></head><body>
<header><div class="nav"><div class="logo">RNP SHOP</div><div class="search"><input id="q" placeholder="🔎 পণ্য খুঁজুন"></div><a href="/order" class="btn" style="text-decoration:none">🛍️ অর্ডার</a><a href="/admin.html" style="color:#087443;font-weight:800">Admin</a></div></header>
<section class="hero"><div><h1>RNP SHOP</h1><p>Premium Green & White Online Store<br>সহজে পণ্য বাছাই করুন এবং অর্ডার করুন।</p></div></section>
<main class="wrap"><h2>জনপ্রিয় পণ্য</h2><div id="grid" class="grid"></div>
<section class="order"><h2>🛍️ অর্ডার দিন</h2><p class="muted">কার্টে পণ্য যোগ করে নিচের ফর্ম পূরণ করুন।</p><div id="cart"></div><h3>মোট: ৳<span id="total">0</span></h3>
<form id="form"><input id="name" required placeholder="আপনার নাম"><input id="phone" required placeholder="মোবাইল নম্বর"><textarea id="address" required placeholder="সম্পূর্ণ ডেলিভারি ঠিকানা"></textarea><select id="payment"><option>Cash on Delivery</option><option>bKash</option><option>Nagad</option></select><textarea id="note" placeholder="অতিরিক্ত নোট (ঐচ্ছিক)"></textarea><button class="btn">অর্ডার কনফার্ম করুন</button></form><div class="success" id="success"></div></section></main>
<script>
let products=[],cart=[];const $=id=>document.getElementById(id);function money(n){return Number(n).toLocaleString("bn-BD")}
async function loadProducts(){let r=await fetch('/api/products');products=await r.json();render();renderCart()}
function render(){let q=$("q").value.toLowerCase();$("grid").innerHTML=products.filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<div class="card"><div class="pic">${p.image?`<img src="${p.image}" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`:p.icon||'🛍️'}</div><h3>${p.name}</h3><div class="price">৳${money(p.price)}</div><button class="btn" onclick="add(${p.id})">কার্টে যোগ করুন</button></div>`).join("")||'<p>কোনো পণ্য পাওয়া যায়নি।</p>'}
function add(id){let x=cart.find(i=>i.id==id);x?x.qty++:cart.push({id,qty:1});renderCart()}
function renderCart(){$("cart").innerHTML=cart.length?cart.map(i=>{let p=products.find(x=>x.id==i.id);return `<div class="items"><span>${p.image?`<img src="${p.image}" style="width:45px;height:45px;object-fit:cover;border-radius:7px">`:p.icon}</span><b>${p.name}</b><span>৳${money(p.price)}</span><div class="qty"><button type="button" onclick="chg(${p.id},-1)">−</button>${i.qty}<button type="button" onclick="chg(${p.id},1)">+</button></div></div>`}).join(""):"<p class='muted'>কার্ট খালি।</p>";$('total').textContent=money(cart.reduce((s,i)=>s+products.find(p=>p.id==i.id).price*i.qty,0))}
function chg(id,d){let x=cart.find(i=>i.id==id);x.qty+=d;if(x.qty<1)cart=cart.filter(i=>i.id!=id);renderCart()}
$("q").oninput=render;$('form').onsubmit=async e=>{e.preventDefault();if(!cart.length)return alert('আগে পণ্য যোগ করুন');let body={customer_name:$('name').value,phone:$('phone').value,address:$('address').value,payment_method:$('payment').value,note:$('note').value,total:cart.reduce((s,i)=>s+products.find(p=>p.id==i.id).price*i.qty,0),items:cart.map(i=>{let p=products.find(x=>x.id==i.id);return{name:p.name,qty:i.qty,price:p.price}})};let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)return alert(d.error||'অর্ডার হয়নি');$('success').style.display='block';$('success').innerHTML=`<b>✅ অর্ডার সফল: ${d.order_no}</b><br><a class="btn" href="${d.whatsapp}" target="_blank">WhatsApp-এ অর্ডার পাঠান</a><a class="btn" href="${d.phone}">📞 ফোন করুন</a>`;cart=[];renderCart();e.target.reset()};loadProducts();
</script></body></html>
